{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zoo.fullname" . }}
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zoo.fullname" . }}-web
                port: {name: http}
    - host: {{ required "ingress.apiHost is required" .Values.ingress.apiHost | quote }}
      http:
        paths:
          # guests in sandboxes on other hosts, and in macOS and Windows VMs, dial the gateway here
          - path: /guest/connect
            pathType: Exact
            backend:
              service:
                name: {{ include "zoo.fullname" . }}-gateway
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zoo.fullname" . }}-api
                port: {name: http}
{{- end }}
