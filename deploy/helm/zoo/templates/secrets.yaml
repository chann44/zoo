{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "zoo.secretName" . }}
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "zoo.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $name, $ref := .Values.externalSecrets.data }}
    - secretKey: {{ $name }}
      remoteRef:
        {{- toYaml $ref | nindent 8 }}
    {{- end }}
{{- else if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "zoo.secretName" .)).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zoo.secretName" . }}
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
  annotations:
    # losing ZOO_SECRETS_KEY loses every stored secret, so uninstalling the chart leaves this behind
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_SECRET: {{ index $existing "JWT_SECRET" | default (randAlphaNum 64 | b64enc) }}
  ZOO_SECRETS_KEY: {{ index $existing "ZOO_SECRETS_KEY" | default (randAlphaNum 64 | b64enc) }}
{{- end }}
