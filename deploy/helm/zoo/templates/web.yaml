apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zoo.fullname" . }}-web
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "zoo.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zoo.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "zoo.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ZOO_API_URL
              value: {{ include "zoo.apiUrl" . | quote }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 20
            failureThreshold: 6
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
