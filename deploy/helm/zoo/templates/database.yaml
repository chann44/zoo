{{- if eq .Values.database.mode "cnpg" }}
# CloudNativePG makes the secret <name>-app with the database's URL (key uri), which Zoo reads as DATABASE_URL
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "zoo.fullname" . }}-db
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.cnpg.instances }}
  {{- with .Values.database.cnpg.imageName }}
  imageName: {{ . }}
  {{- end }}
  bootstrap:
    initdb:
      database: zoo
      owner: zoo
  storage:
    size: {{ .Values.database.cnpg.storage.size }}
    {{- with .Values.database.cnpg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- with .Values.database.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.database.cnpg.backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
