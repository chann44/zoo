services:
  sandbox-image:
    build: .
    image: zoo-sandbox:latest
    entrypoint: ["true"]

  code-image:
    build:
      context: .
      dockerfile: Dockerfile.code
    image: zoo-code:latest
    entrypoint: ["true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      code-image:
        condition: service_completed_successfully
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ZOO_BROWSER_HOME: ${ZOO_BROWSER_HOME:-https://duckduckgo.com}
      ZOO_DOMAIN: ${ZOO_DOMAIN:-}
      ZOO_PUBLIC_IP: ${ZOO_PUBLIC_IP:-}
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - zoo-data:/data
      - ${ZOO_SSH_DIR:-~/.ssh}:/root/.ssh:ro
    networks:
      - zoo

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - zoo

  caddy:
    image: caddy:2
    profiles: ["domain"]
    depends_on:
      - web
      - api
    environment:
      ZOO_GRAFANA_DOMAIN: ${ZOO_GRAFANA_DOMAIN:-grafana.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - zoo

  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "3001:3000"
    volumes:
      - lgtm-data:/data
    networks:
      - zoo

networks:
  zoo:
    name: zoo

volumes:
  zoo-data:
  caddy-data:
  lgtm-data:
