services:
  sandbox-image:
    build: .
    image: ${ZOO_SANDBOX_IMAGE:-zoo-sandbox:latest}
    entrypoint: ["true"]

  code-image:
    build:
      context: .
      dockerfile: Dockerfile.code
    image: ${ZOO_CODE_IMAGE:-zoo-code:latest}
    entrypoint: ["true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      code-image:
        condition: service_completed_successfully
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ZOO_BROWSER_HOME: ${ZOO_BROWSER_HOME:-https://duckduckgo.com}
      ZOO_DOMAIN: ${ZOO_DOMAIN:-}
      ZOO_PUBLIC_IP: ${ZOO_PUBLIC_IP:-}
      ZOO_RUNTIME: ${ZOO_RUNTIME:-kata}
      ZOO_SANDBOX_IMAGE: ${ZOO_SANDBOX_IMAGE:-zoo-sandbox:latest}
      ZOO_CODE_IMAGE: ${ZOO_CODE_IMAGE:-zoo-code:latest}
      ZOO_MACOS_BASE: ${ZOO_MACOS_BASE:-zoo-macos-base}
      ZOO_MACOS_USER: ${ZOO_MACOS_USER:-admin}
      ZOO_WINDOWS_BASE: ${ZOO_WINDOWS_BASE:-zoo-windows-base}
      ZOO_WINDOWS_MAX_VMS: ${ZOO_WINDOWS_MAX_VMS:-4}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZOO_AGENT_MODEL: ${ZOO_AGENT_MODEL:-anthropic/claude-sonnet-5-5}
      ZOO_AGENT_MAX_STEPS: ${ZOO_AGENT_MAX_STEPS:-100}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - zoo-data:/data
      - ${ZOO_SSH_DIR:-~/.ssh}:/root/.ssh:ro
    networks:
      - zoo

  web:
    build: ./web
    environment:
      ZOO_API_URL: ${ZOO_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - zoo

  caddy:
    image: caddy:2
    profiles: ["domain"]
    depends_on:
      - web
      - api
    environment:
      ZOO_GRAFANA_DOMAIN: ${ZOO_GRAFANA_DOMAIN:-grafana.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - zoo

  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "3001:3000"
    volumes:
      - lgtm-data:/data
    networks:
      - zoo

networks:
  zoo:
    name: zoo

volumes:
  zoo-data:
  caddy-data:
  lgtm-data:
