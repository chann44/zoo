# Build the marketing site + docs and deploy to GitHub Pages.
#
# One-time: repo Settings → Pages → Source: "GitHub Actions".
# Docs' Reference pages are generated from the code, so Python runs first.

name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "server/**"
      - "sdk/**"
      - "integrations/**"
      - "main.py"
      - ".github/workflows/site.yml"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the docs release badge

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2

      - name: Generate reference docs
        run: uv run --project . python site/scripts/generate_reference.py

      - name: Build site
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
