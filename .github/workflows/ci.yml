name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOOSE_VERSION: v3.26.0

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format github .
      - run: uv run ruff format --check .
      # fails only on type errors not in .basedpyright/baseline.json
      - run: uv run basedpyright
      - run: uv run pytest --ignore=tests/e2e --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  postgres:
    name: Python on Postgres
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # the same suite, every test on its own database copied from the migrated Postgres schema
      - run: uv run pytest --ignore=tests/e2e
        env:
          ZOO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            kubernetes:
              - server/kube.py
              - server/docker.py
              - server/pool.py
              - tests/kubernetes/**
              - deploy/helm/**

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/zoo
      - name: Renders with the defaults, external Postgres, External Secrets and a ServiceMonitor
        run: |
          helm template zoo deploy/helm/zoo > /dev/null
          helm template zoo deploy/helm/zoo --set database.mode=external --set database.external.existingSecret=db \
            --set externalSecrets.enabled=true --set externalSecrets.secretStoreRef.name=vault \
            --set metrics.serviceMonitor.enabled=true --set sandboxes.enabled=false > /dev/null

  kubernetes:
    name: Kubernetes driver (kind, runc)
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: helm/kind-action@v1
        with:
          cluster_name: zoo
      - name: The runc RuntimeClass and the test image
        run: |
          kubectl apply -f tests/kubernetes/runtimeclass-runc.yaml
          docker build -t zoo-kube-test:1 tests/kubernetes
          kind load docker-image zoo-kube-test:1 --name zoo
      - run: uv run pytest tests/kubernetes -v
        env:
          ZOO_TEST_KUBERNETES: zoo-ci
          ZOO_TEST_RUNTIME_CLASS: runc
      - name: Pods
        if: failure()
        run: kubectl get pods -A -o wide && kubectl get events -A --sort-by=.lastTimestamp | tail -50

  guest:
    name: Guest (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: guest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: The egress ruleset loads into real nftables
        run: |
          sudo apt-get install -y --no-install-recommends nftables
          sudo env "PATH=$PATH" ZOO_TEST_NFT=1 go test -run TestRenderedRulesetLoads -v ./...

  node:
    name: zoo-node (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Builds for every host platform
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./... && GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null . || exit 1
          done

  windows:
    name: Windows (guest and tools on real Windows)
    # Every Windows sandbox tool goes through zoo-guest, so a real Windows desktop with a real guest covers them;
    # Hyper-V itself (clone, start, push, move) runs in the nightly end-to-end job on a Hyper-V host.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum
      - name: Guest tests
        working-directory: guest
        run: go test ./...
      - name: Build zoo-guest
        working-directory: guest
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/zoo-guest-windows-amd64.exe .
      # the scripts run under Windows PowerShell 5.1 on hosts and in VMs, so they're parsed and analyzed with it
      - name: PowerShell scripts parse
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem windows\*.ps1) {
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=windows/$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: PowerShell scripts analyze
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $found = @(Invoke-ScriptAnalyzer -Path windows -Severity Error)
          $found | ForEach-Object { Write-Host "::error file=windows/$($_.ScriptName),line=$($_.Line)::$($_.RuleName): $($_.Message)" }
          if ($found.Count) { exit 1 }
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Windows tools against a live guest
        env:
          ZOO_GUEST_EXE: ${{ github.workspace }}\guest\dist\zoo-guest-windows-amd64.exe
        run: uv run pytest tests/windows_live -v -s

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  schema:
    name: Schema
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: sqlc generate leaves no diff
        run: |
          uv run sqlc generate
          git diff --exit-code -- db/generated
      - name: Install goose
        run: |
          curl -fsSL "https://github.com/pressly/goose/releases/download/$GOOSE_VERSION/goose_linux_x86_64" -o /usr/local/bin/goose
          chmod +x /usr/local/bin/goose
      - name: Migrations run up and down on an empty database
        run: |
          db="$RUNNER_TEMP/zoo.db"
          goose -dir db/migrations sqlite3 "$db" up
          goose -dir db/migrations sqlite3 "$db" reset
          goose -dir db/migrations sqlite3 "$db" up
      - name: Postgres migrations run up and down on an empty database
        run: |
          url="postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
          goose -dir db/postgres postgres "$url" up
          goose -dir db/postgres postgres "$url" reset
          goose -dir db/postgres postgres "$url" up

  scripts:
    name: Dockerfiles and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: hadolint
        run: |
          for file in Dockerfile Dockerfile.api Dockerfile.code web/Dockerfile; do
            echo "::group::$file"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint:v2.12.0 \
              hadolint --config /.config/hadolint.yaml - < "$file"
            echo "::endgroup::"
          done
      - name: shellcheck
        run: shellcheck install.sh deploy/zoo scripts/*.sh sandbox-entrypoint.sh macos/zoovm/build.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Warning,Error
          $results | Format-Table -AutoSize -Wrap
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

  zoovm:
    name: zoovm (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: sh macos/zoovm/build.sh --no-install

  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, context: ., file: Dockerfile.api }
          - { image: web, context: web, file: web/Dockerfile }
          - { image: sandbox-desktop, context: ., file: Dockerfile }
          - { image: sandbox-code, context: ., file: Dockerfile.code }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: docker.io/chann44/zoo-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,scope=${{ matrix.image }}-amd64,mode=max
      - name: Trivy (critical CVEs with a known fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            docker.io/chann44/zoo-${{ matrix.image }}:ci

  e2e:
    name: End-to-end (runc)
    needs: images
    runs-on: ubuntu-24.04
    env:
      ZOO_VERSION: ci
      ZOO_RUNTIME: runc
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-for-hs256
      ZOO_SECRETS_KEY: ci-secrets-key
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@v3
      # rebuilt from the cache the images job filled, so this is mostly layer reuse
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: docker.io/chann44/zoo-api:ci
          cache-from: type=gha,scope=api-amd64
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          load: true
          tags: docker.io/chann44/zoo-web:ci
          cache-from: type=gha,scope=web-amd64
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: docker.io/chann44/zoo-sandbox-desktop:ci
          cache-from: type=gha,scope=sandbox-desktop-amd64
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.code
          load: true
          tags: docker.io/chann44/zoo-sandbox-code:ci
          cache-from: type=gha,scope=sandbox-code-amd64
      - run: docker compose up -d
      - run: scripts/e2e.sh
      - name: Logs
        if: failure()
        run: docker compose logs --tail 200

  ci:
    # the one check branch protection requires; it fails if any job above failed or was cancelled
    name: CI passed
    if: always()
    needs: [python, postgres, chart, kubernetes, guest, node, web, schema, scripts, zoovm, images, e2e]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok
